<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乗務タブレット</title>
<style>
  /* 乗務タブレット。配置は tablet-layout.xml（XAML 風）で決める。スタフ（紙）の部分は、暗い表示でも白地 */
  :root {
    --bg: #1b2533; --panel: #22304a; --bar: #26354b; --fg: #e8eef6; --muted: #93a3b8; --line: #33445c;
    --ok: #1f8a4c; --warn: #c98400; --ng: #c62828; --info: #2f6fc0;
    --paper: #ffffff; --ink: #111111; --rule: #222222; --stop: #6eb4f7; --now: #fff2a8; --done: #8a8a8a; --late: #c62828;
    --mono: "Consolas", "Menlo", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", sans-serif; font-size: 13px; line-height: 1.5; padding: 8px; }
  button, select { font: inherit; }
  .header { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; background: var(--bar); border-radius: 8px; padding: 6px 12px; margin-bottom: 8px; }
  .t-large { font-family: var(--mono); font-size: 22px; font-weight: 700; }
  .t-muted { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .badge { font-size: 12px; font-weight: 700; border-radius: 4px; padding: 1px 8px; color: #fff; background: #607089; }
  .delay { font-family: var(--mono); font-weight: 700; color: #fff; background: var(--warn); border-radius: 4px; padding: 0 6px; }
  .clock { font-family: var(--mono); font-size: 18px; }
  .grid { display: grid; }
  .stack { display: grid; align-content: start; min-width: 0; }
  @media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr) !important; } }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
  .pane h5 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  .big { font-size: 20px; font-weight: 700; }
  .route { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 4px; padding: 1px 8px; }
  .route.ok { background: var(--ok); color: #fff; }
  .route.wait { color: var(--warn); border: 1px solid var(--warn); }
  .route.req { color: var(--muted); border: 1px solid var(--line); }
  .status { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--line); }
  .dot.ok { background: var(--ok); } .dot.ng { background: var(--ng); }
  .pick { max-width: 520px; margin: 40px auto; display: grid; gap: 10px; }
  .pick .pane { display: grid; gap: 8px; }
  .pick button { border: 1px solid var(--line); background: var(--bar); color: var(--fg); border-radius: 6px; padding: 6px 10px; cursor: pointer; text-align: left; }
  .pick .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .err { color: #ffb4b4; }

  /* スタフ */
  .staff { background: var(--paper); color: var(--ink); border: 2px solid var(--rule); border-radius: 4px; min-width: 0; }
  .staff-scroll { overflow-x: auto; }
  table.staff-tt { border-collapse: collapse; width: 100%; font-size: 13px; color: var(--ink); }
  .staff-tt th { font-size: 10px; font-weight: 700; text-align: center; border: 1px solid var(--rule); padding: 1px 2px; background: var(--paper); }
  .staff-tt td { border: 1px solid var(--rule); padding: 0 4px; height: 1.6em; vertical-align: middle; font-variant-numeric: tabular-nums; background: var(--paper); }
  .staff-tt tr.arr td:not(.st):not(.h) { border-bottom-color: transparent; }
  .staff-tt tr.arr + tr.dep td { border-top-color: transparent; }
  .staff-tt td.st { font-size: 17px; font-weight: 700; white-space: nowrap; width: 30%; }
  .staff-tt td.st.stop { background: var(--stop); }
  .staff-tt td.st.pass { font-size: 13px; font-weight: 400; }
  .staff-tt td.st.off { color: #555; }
  .staff-tt td.h { text-align: center; font-weight: 700; font-size: 14px; width: 8%; }
  .staff-tt td.m, .staff-tt td.s { text-align: center; font-family: var(--mono); width: 9%; }
  .staff-tt tr.arr td.m { text-align: right; }
  .staff-tt tr.dep.stopping td.m { font-size: 19px; font-weight: 700; }
  .staff-tt td.note { font-size: 13px; white-space: nowrap; }
  .staff-tt td.note small { font-size: 10px; }
  .staff-tt b.trk { font-size: 15px; margin-right: 4px; }
  .staff-tt td.act { font-family: var(--mono); font-size: 11px; color: var(--done); text-align: center; border-left: 2px solid var(--rule); width: 14%; }
  .staff-tt td.act.late { color: var(--late); font-weight: 700; }
  .staff-tt tr.done td.m, .staff-tt tr.done td.s { color: var(--done); }
  .staff-tt tr.now td:not(.st):not(.h) { background: var(--now); }
  .staff-foot { border-top: 2px solid var(--rule); padding: 4px 10px; font-size: 12px; font-weight: 700; }

  /* 行路 */
  .duty-list { display: grid; gap: 3px; font-size: 12px; }
  .duty-item { display: grid; grid-template-columns: 4.5em minmax(0, 1fr); gap: 6px; padding: 3px 6px; border-radius: 4px; }
  .duty-item .k { color: var(--muted); }
  .duty-item.cur { background: var(--info); color: #fff; }
  .duty-item.cur .k { color: #dfe9f7; }
  .mono { font-family: var(--mono); }
</style>
</head>
<body>
<div id="app"></div>
<script>
  // 乗務タブレット。?train=列番 でその列車を表示する（クライアントの「乗務タブレット」ボタンは、自分の列番を付けて開く）。
  // 列番がなければ、走っている列車と行路の一覧から選ぶ。2秒ごとに /api/tid/tablet を読み直す。
  // ログインすると、その人の行路を出す。列番を付けずに開けば、その人の行路の、いま乗る列車を出す。
  // パスワードはサーバーが作って一度だけ見せる（メモしてもらう）。忘れたら秘密の質問3つで出し直す。
  // ログインの合い札（トークン）とユーザー名はこのブラウザに覚えておく。「ログアウト」で消す
  const params = new URLSearchParams(location.search);
  let train = params.get("train") || "";
  let user = "", token = "";
  try { user = localStorage.getItem("gokkoTabletUser") || ""; token = localStorage.getItem("gokkoTabletToken") || ""; } catch (e) {}
  if (!token) user = "";
  function setUser(name, tok) {
    user = name || ""; token = name ? tok || "" : "";
    try {
      if (user) { localStorage.setItem("gokkoTabletUser", user); localStorage.setItem("gokkoTabletToken", token); }
      else { localStorage.removeItem("gokkoTabletUser"); localStorage.removeItem("gokkoTabletToken"); }
    } catch (e) {}
  }
  async function post(path, body) {
    const res = await fetch("/api/tid" + path, { method: "POST", headers: { "Content-Type": "application/json", ...(token ? { "X-Crew-Token": token } : {}) }, body: JSON.stringify(body || {}) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.message || "うまくいきませんでした");
    return j;
  }
  let layout = null, data = null, lastOk = 0, error = "";

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const circled = (n) => n >= 1 && n <= 20 ? String.fromCharCode(0x2460 + n - 1) : (n ?? "");
  const sec = (t) => { if (!t) return null; const p = t.split(":").map(Number); return p[0] * 3600 + p[1] * 60 + (p[2] || 0); };
  const typeColor = { "特急": "#c62828", "快急": "#7b3fb5", "急行": "#d9731f", "区急": "#2e8b57", "準急": "#1e88f0", "普通": "#607089", "回送": "#ffffff" };

  function bind(name) {
    if (!data) return "";
    switch (name) {
      case "train.number": return data.train;
      case "train.type": return data.type;
      case "train.label": return data.label;
      case "train.dest": return data.dest;
      case "train.unyo": return data.unyo ?? "";
      case "duty.id": return data.duty ? data.duty.id : "";
      case "duty.handle": return data.duty ? fmtMin(data.duty.handleMinutes) : "";
      case "delay": return data.delay ?? "";
      case "gameTime": return data.gameTime;
      case "crew.name": return data.crew ?? "";
      default: return "";
    }
  }
  const fmtMin = (m) => `${Math.floor(m / 60)}時間${String(m % 60).padStart(2, "0")}分`;

  // ---- 部品 ----
  const parts = {
    Tablet: (el) => children(el),
    Header: (el) => `<div class="header">${children(el)}</div>`,
    Grid: (el) => {
      const cols = (el.getAttribute("Columns") || "1*").split(",").map((c) => c.trim().endsWith("*") ? `minmax(0, ${c.trim().slice(0, -1) || 1}fr)` : c.trim());
      const gap = el.getAttribute("Gap") || "8";
      const kids = [...el.children].map((c, i) => ({ c, col: Number(c.getAttribute("Grid.Column") ?? i) })).sort((a, b) => a.col - b.col);
      return `<div class="grid" style="grid-template-columns:${cols.join(" ")};gap:${gap}px">${kids.map((k) => render(k.c)).join("")}</div>`;
    },
    Stack: (el) => `<div class="stack" style="gap:${el.getAttribute("Gap") || 8}px">${children(el)}</div>`,
    Spacer: () => `<span class="spacer"></span>`,
    Text: (el) => {
      const v = bind(el.getAttribute("Bind"));
      if (v === "" || v == null) return "";
      const style = el.getAttribute("Style");
      return `<span class="${style === "Large" ? "t-large" : style === "Muted" ? "t-muted" : ""}">${esc((el.getAttribute("Prefix") || "") + v + (el.getAttribute("Suffix") || ""))}</span>`;
    },
    Badge: (el) => {
      const v = bind(el.getAttribute("Bind") || "train.type");
      if (!v) return "";
      const bg = typeColor[v] || "#607089";
      return `<span class="badge" style="background:${bg};color:${v === "回送" ? "#d32f2f" : "#fff"};${v === "回送" ? "border:1px solid #111" : ""}">${esc(data.label || v)}</span>`;
    },
    Delay: () => data && data.delay ? `<span class="delay">+${data.delay}分</span>` : "",
    Clock: () => data ? `<span class="clock">${esc(data.gameTime)}</span>` : "",
    Staff: (el) => staff(el.getAttribute("Actual") !== "false"),
    NextStation: () => nextStation(),
    Duty: () => duty(),
    TrainNext: () => trainNext(),
    StatusBar: () => {
      const age = lastOk ? Math.round((Date.now() - lastOk) / 1000) : null;
      const ok = age != null && age < 6;
      return `<div class="status"><span><span class="dot ${ok ? "ok" : "ng"}"></span>サーバー${ok ? "" : "（更新が止まっています）"}</span>
        <span>${data && data.running ? "走行中" : "まだ走っていない（ダイヤを表示）"}</span>
        <span>最終更新 ${age == null ? "-" : age + "秒前"}</span>
        <span>${user ? `ログイン: ${esc(user)}（<a href="#" data-logout="1" style="color:var(--muted)">ログアウト</a>）`
          : `<a href="#" data-login="1" style="color:var(--muted)">ログイン</a>`}</span>
        <span><a href="tablet.html${user ? "" : "?pick=1"}" style="color:var(--muted)">${user ? "行路の列車に戻る" : "列車を選び直す"}</a></span>${error ? `<span class="err">${esc(error)}</span>` : ""}</div>`;
    }
  };
  const children = (el) => [...el.children].map(render).join("");
  const render = (el) => (parts[el.tagName] || (() => ""))(el);

  // スタフ: 停車駅は着（上の行・小さく）と発（下の行・太く）。通過は1行。時は変わる所だけ。右端に番線と記事、実績
  function staff(actual) {
    if (!data) return "";
    let lastHour = null;
    const rows = [];
    data.stops.forEach((s, i) => {
      const stopping = s.stop !== "通";
      const isNow = i === data.next;
      const cls = (s.passed ? "done " : "") + (isNow ? "now " : "");
      const name = stopping ? esc(s.name) : `（${esc(s.name)}）`;
      const stCls = `st ${stopping ? "stop" : "pass"} ${s.control ? "" : "off"}`;
      const trk = s.track ? `<b class="trk">${circled(s.track)}</b>` : "";
      const memo = s.note ? `<small>${esc(s.note.replace(/;/g, "　"))}</small>` : "";
      const lines = [];
      if (stopping && s.arr && s.dep && s.arr !== s.dep) {
        lines.push({ kind: "arr", t: s.arr, act: s.actArr }, { kind: "dep", t: s.dep, act: s.actDep });
      } else {
        lines.push({ kind: "dep", t: s.dep || s.arr, act: s.actDep || s.actArr });
      }
      lines.forEach((ln, j) => {
        const p = (ln.t || "").split(":");
        const hour = p[0] || "";
        const showHour = hour && hour !== lastHour;
        if (hour) lastHour = hour;
        const late = ln.act && ln.t && sec(ln.act) - sec(ln.t) >= 60;
        const act = actual ? `<td class="act ${late ? "late" : ""}">${ln.act ? esc(ln.act.slice(3)) : (isNow && j === 0 ? "<b style='color:#111;font-size:10px'>次</b>" : "")}</td>` : "";
        const first = j === 0;
        const span = lines.length;
        rows.push(`<tr class="${cls}${ln.kind}${stopping ? " stopping" : ""}">
          ${first ? `<td class="${stCls}" rowspan="${span}">${name}</td>` : ""}
          <td class="h">${showHour ? esc(Number(hour)) : ""}</td>
          <td class="m">${esc(p[1] || "")}</td><td class="s">${esc(p[2] || "")}</td>
          <td class="note">${span === 1 ? trk + memo : first ? trk : memo}</td>${act}</tr>`);
      });
    });
    return `<div class="staff"><div class="staff-scroll"><table class="staff-tt">
      <thead><tr><th>駅</th><th>時</th><th>分</th><th>秒</th><th>番線・記事</th>${actual ? "<th>実績</th>" : ""}</tr></thead>
      <tbody>${rows.join("")}</tbody></table></div></div>`;
  }

  function trainNext() {
    if (!data) return "";
    const out = [];
    if (data.renumber) out.push(`▼ ${esc(data.renumber.station)}から ${esc(data.renumber.number)} に列番変更`);
    if (data.turn) {
      const t = data.turn;
      out.push(t.kind === "折返" ? `折返：${esc(t.number)}（${esc(t.time)}${esc(t.how || "")}）` : esc(t.kind) + (t.number ? `：${esc(t.number)}` : ""));
    }
    return out.length ? `<div class="staff"><div class="staff-foot">${out.join("<br>")}</div></div>` : "";
  }

  function nextStation() {
    if (!data) return "";
    const s = data.next >= 0 ? data.stops[data.next] : data.stops.find((x) => x.control && !x.passed);
    if (!s) return `<div class="pane"><h5>次の駅</h5>この先に駅はありません</div>`;
    const stopping = s.stop !== "通";
    const chip = (r) => !r ? "" : r === "進路確定" ? `<span class="route ok">進路確定</span>` : r.includes("要求待ち") ? `<span class="route req">${esc(r)}</span>` : `<span class="route wait">${esc(r)}</span>`;
    return `<div class="pane"><h5>次の駅</h5>
      <div class="big">${esc(s.name)}${s.track ? ` ${s.track}番線` : ""}${stopping ? "" : "（通過）"}</div>
      <div>${s.arr && stopping ? `着 ${esc(s.arr)}　` : ""}${s.dep ? `${stopping ? "発" : "通過"} ${esc(s.dep)}` : ""}</div>
      ${s.route ? `<div style="margin-top:6px">進路 ${chip(s.route)}</div>` : ""}</div>`;
  }

  function duty() {
    if (!data || !data.duty) return "";
    const d = data.duty;
    const items = d.items.map((x) => `<div class="duty-item ${x.current ? "cur" : ""}"><span class="k">${esc(x.kind)}</span>
      <span>${x.kind === "休憩" ? esc((x.from || "") + " " + (x.note || "")) : `<b class="mono">${esc(x.train)}</b>　${esc(x.from || "")} ${esc((x.dep || "").slice(0, 5))} → ${esc(x.to || "")} ${esc((x.arr || "").slice(0, 5))}${x.note ? "　" + esc(x.note) : ""}`}</span></div>`).join("");
    return `<div class="pane"><h5>行路 ${esc(d.id)}　ハンドルタイム ${fmtMin(d.handleMinutes)}</h5><div class="duty-list">${items}</div></div>`;
  }

  // ---- ログイン・新規登録・パスワードを忘れたとき・秘密の質問 ----
  const inputStyle = "padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)";
  const app = () => document.getElementById("app");
  const afterLogin = () => { location.href = "tablet.html" + (train ? "?train=" + encodeURIComponent(train) : ""); };
  let questionList = null;
  async function questions() {
    if (!questionList) questionList = (await (await fetch("/api/tid/crew/questions", { cache: "no-store" })).json()).questions;
    return questionList;
  }
  // 秘密の質問3つ（選ぶ欄と答えの欄）
  async function qaFields() {
    const qs = await questions();
    return [0, 1, 2].map((i) => `<div style="display:grid;gap:4px">
        <select data-q="${i}" style="${inputStyle}">${qs.map((q, j) => `<option ${j === i ? "selected" : ""}>${esc(q)}</option>`).join("")}</select>
        <input data-a="${i}" placeholder="答え" style="${inputStyle}"></div>`).join("");
  }
  const readQa = () => [0, 1, 2].map((i) => ({ question: document.querySelector(`[data-q="${i}"]`).value, answer: document.querySelector(`[data-a="${i}"]`).value }));
  const links = (...items) => `<div class="pane row">${items.join("　")}</div>`;
  const link = (key, text) => `<a href="#" data-go="${key}" style="color:var(--muted)">${text}</a>`;
  function bindSubmit(run) {
    const btn = document.getElementById("submit"), msg = document.getElementById("lmsg");
    const go = async () => { msg.textContent = ""; btn.disabled = true; try { await run(); } catch (e) { msg.textContent = e.message; } finally { btn.disabled = false; } };
    btn.onclick = go;
    app().querySelectorAll("input").forEach((i) => i.addEventListener("keydown", (ev) => { if (ev.key === "Enter") go(); }));
    const first = app().querySelector("input"); if (first) first.focus();
  }

  function loginScreen(message) {
    stopped = true;
    document.title = "乗務タブレット ログイン";
    app().innerHTML = `<div class="pick">
      <div class="pane"><h5>ログイン</h5>
        <input id="uname" placeholder="ユーザー名" autocomplete="username" style="${inputStyle}">
        <input id="upass" placeholder="パスワード（例: k7mq-3xwp）" type="password" autocomplete="current-password" style="${inputStyle}">
        <div class="row"><button id="submit">ログイン</button></div>
        <div id="lmsg" class="err">${esc(message || "")}</div></div>
      ${links(link("register", "はじめての人（新規登録）"), link("forgot", "パスワードを忘れた"), `<a href="tablet.html?pick=1" style="color:var(--muted)">ログインしないで列車を選ぶ</a>`)}</div>`;
    bindSubmit(async () => {
      const j = await post("/login", { name: document.getElementById("uname").value.trim(), password: document.getElementById("upass").value });
      setUser(j.name, j.token);
      if (j.needQuestions) await setQuestionsScreen(); else afterLogin();
    });
  }

  async function registerScreen() {
    app().innerHTML = `<div class="pick">
      <div class="pane"><h5>新規登録</h5>
        <input id="uname" placeholder="ユーザー名（20文字まで。ほかの人と同じ名前は使えません）" maxlength="20" style="${inputStyle}">
        <div class="t-muted">パスワードを忘れたときに使う、秘密の質問を3つ決めてください（3つとも合っていれば、パスワードを出し直します）</div>
        ${await qaFields()}
        <div class="row"><button id="submit">登録する</button></div>
        <div id="lmsg" class="err"></div></div>
      ${links(link("login", "ログインに戻る"))}</div>`;
    bindSubmit(async () => {
      const j = await post("/register", { name: document.getElementById("uname").value.trim(), questions: readQa() });
      setUser(j.name, j.token);
      passwordScreen(j.name, j.password, "登録しました");
    });
  }

  async function forgotScreen() {
    app().innerHTML = `<div class="pick">
      <div class="pane"><h5>パスワードを忘れた</h5>
        <div class="t-muted">ユーザー名を入れると、登録した秘密の質問が出ます。3つとも答えられれば、新しいパスワードを出します。</div>
        <input id="uname" placeholder="ユーザー名" style="${inputStyle}">
        <div id="qs" style="display:grid;gap:6px"></div>
        <div class="row"><button id="submit">次へ</button></div>
        <div id="lmsg" class="err"></div></div>
      ${links(link("login", "ログインに戻る"))}</div>`;
    let asked = null;
    bindSubmit(async () => {
      const name = document.getElementById("uname").value.trim();
      if (!asked) {
        asked = (await post("/forgot", { name })).questions;
        document.getElementById("uname").readOnly = true;
        document.getElementById("qs").innerHTML = asked.map((q, i) => `<div style="display:grid;gap:4px"><span>${esc(q)}</span><input data-a="${i}" placeholder="答え" style="${inputStyle}"></div>`).join("");
        document.getElementById("submit").textContent = "パスワードを出し直す";
        document.querySelectorAll("#qs input").forEach((x) => x.addEventListener("keydown", (ev) => { if (ev.key === "Enter") document.getElementById("submit").click(); }));
        document.querySelector('[data-a="0"]').focus();
        return;
      }
      const j = await post("/forgot/reset", { name, answers: [0, 1, 2].map((i) => document.querySelector(`[data-a="${i}"]`).value) });
      setUser(j.name, j.token);
      passwordScreen(j.name, j.password, "新しいパスワードを出しました（前のパスワードは使えません）");
    });
  }

  // 秘密の質問がまだ決まっていない人（勤怠管理の画面で作られた人）は、ログインのあとに決める
  async function setQuestionsScreen() {
    app().innerHTML = `<div class="pick">
      <div class="pane"><h5>秘密の質問を決める</h5>
        <div class="t-muted">${esc(user)} さん、パスワードを忘れたときに使う秘密の質問を3つ決めてください。</div>
        ${await qaFields()}
        <div class="row"><button id="submit">決める</button></div>
        <div id="lmsg" class="err"></div></div></div>`;
    bindSubmit(async () => { await post("/crew/set-questions", { questions: readQa() }); afterLogin(); });
  }

  // パスワードは一度だけ見せる。メモしたことを確かめてから進む
  function passwordScreen(name, password, title) {
    app().innerHTML = `<div class="pick">
      <div class="pane"><h5>${esc(title)}</h5>
        <div>ユーザー名 <b>${esc(name)}</b></div>
        <div>パスワード</div>
        <div class="mono" style="font-size:34px;font-weight:700;letter-spacing:.08em;text-align:center;background:var(--bg);border-radius:6px;padding:8px">${esc(password)}</div>
        <div class="err">このパスワードは、この画面でしか表示しません。必ずメモしてください。</div>
        <label><input type="checkbox" id="memo"> メモしました</label>
        <div class="row"><button id="next" disabled>乗務タブレットへ進む</button></div></div></div>`;
    document.getElementById("memo").onchange = (ev) => { document.getElementById("next").disabled = !ev.target.checked; };
    document.getElementById("next").onclick = afterLogin;
  }

  app().addEventListener("click", (ev) => {
    const a = ev.target.closest("a[data-go]");
    if (!a) return;
    ev.preventDefault();
    ({ login: loginScreen, register: registerScreen, forgot: forgotScreen })[a.dataset.go]();
  });

  // ---- 列車を選ぶ画面 ----
  async function pickScreen() {
    let trains = [], duties = [];
    try { trains = (await (await fetch("/api/tid/state", { cache: "no-store" })).json()).tid.trains.map((t) => t.train); } catch (e) {}
    try { duties = (await (await fetch("/api/tid/duties", { cache: "no-store" })).json()).duties; } catch (e) {}
    const go = (t) => `<button data-train="${esc(t)}">${esc(t)}</button>`;
    document.getElementById("app").innerHTML = `<div class="pick">
      <div class="pane"><h5>列番を入れて開く</h5><div class="row"><input id="no" placeholder="例: 995C" style="flex:1;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)"><button id="open">開く</button></div></div>
      <div class="pane"><h5>走っている列車</h5><div class="row">${trains.length ? trains.map(go).join("") : "<span class='t-muted'>いません</span>"}</div></div>
      <div class="pane"><h5>行路</h5>${duties.length ? duties.map((d) => `<div><b class="mono">${esc(d.id)}</b>　<span class="row" style="display:inline-flex">${d.trains.map(go).join("")}</span></div>`).join("") : "<span class='t-muted'>行路表（Duties.csv）はまだありません</span>"}</div>
      <div class="pane">${user ? `ログイン: ${esc(user)}（<a href="#" data-logout="1" style="color:var(--muted)">ログアウト</a>）` : `<a href="#" data-login="1" style="color:var(--muted)">ログイン</a>`}</div></div>`;
    document.querySelectorAll("button[data-train]").forEach((b) => b.onclick = () => { location.search = "?train=" + encodeURIComponent(b.dataset.train); });
    document.getElementById("open").onclick = () => { const v = document.getElementById("no").value.trim(); if (v) location.search = "?train=" + encodeURIComponent(v); };
  }

  // ログアウト・ログインの文字（ステータスバーと選ぶ画面）
  document.addEventListener("click", (ev) => {
    const a = ev.target.closest("a[data-logout], a[data-login]");
    if (!a) return;
    ev.preventDefault();
    if (a.dataset.logout) { post("/logout").catch(() => {}).finally(() => { setUser(""); location.href = "tablet.html" + (train ? "?train=" + encodeURIComponent(train) : ""); }); }
    else loginScreen();
  });

  let stopped = false;
  async function refresh() {
    if (stopped) return;
    let notice = null;
    try {
      const q = new URLSearchParams();
      if (train) q.set("train", train);
      const res = await fetch("/api/tid/tablet?" + q, { cache: "no-store", headers: token ? { "X-Crew-Token": token } : {} });
      if (!res.ok) {
        const j = await res.json().catch(() => ({}));
        if (j.logout) { setUser(""); loginScreen(j.message); return; } // ユーザーが消された・パスワードが出し直された
        error = j.message || "読み込めませんでした"; data = null;
        if (user && !train) notice = error; // 行路がまだない
      }
      else { data = await res.json(); error = ""; lastOk = Date.now(); }
    } catch (e) { error = "サーバーにつながりません"; }
    document.title = data ? `${data.train} 乗務タブレット` : "乗務タブレット";
    document.getElementById("app").innerHTML = data ? render(layout)
      : `<div class="pick"><div class="pane err">${esc(error)}</div>
          <div class="pane">${user ? `ログイン: ${esc(user)}（<a href="#" data-logout="1" style="color:var(--muted)">ログアウト</a>）　` : ""}<a href="tablet.html?pick=1" style="color:var(--muted)">列車を選ぶ</a></div></div>`;
  }

  (async () => {
    // 列番もログインもなければログインの画面。?pick=1 なら列車を選ぶ画面
    if (params.get("pick")) { await pickScreen(); return; }
    if (!train && !user) { loginScreen(); return; }
    try {
      const xml = await (await fetch("tablet-layout.xml", { cache: "no-store" })).text();
      layout = new DOMParser().parseFromString(xml, "application/xml").documentElement;
      if (layout.getAttribute("FontSize")) document.body.style.fontSize = layout.getAttribute("FontSize") + "px";
    } catch (e) { document.getElementById("app").textContent = "配置ファイル（tablet-layout.xml）を読めませんでした"; return; }
    await refresh();
    setInterval(refresh, 2000);
  })();
</script>
</body>
</html>
