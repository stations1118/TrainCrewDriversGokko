<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ダイヤグラム</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --accent: #2563eb; --danger: #c62828; --ok: #1b7f3b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1d2128; --text: #e6e8eb; --muted: #9aa3ae; --line: #2e333c;
      --accent: #6b9cff; --danger: #ff6b6b; --ok: #5fd08a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Yu Gothic UI", "Hiragino Sans", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 1; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  main { display: grid; gap: 16px; padding: 16px; grid-template-columns: 1fr 1fr; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section.wide { grid-column: 1 / -1; }
  h2 { font-size: 14px; margin: 0 0 10px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
  input, button, select { font: inherit; color: inherit; }
  input, select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  button { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .muted { color: var(--muted); }
  .status { font-weight: bold; }
  .ok { color: var(--ok); } .ng { color: var(--danger); }
  table { border-collapse: collapse; }
  td { padding: 3px 4px; border-bottom: 1px solid var(--line); }
  #error { color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1>ダイヤグラム</h1>
  <label>合言葉 <input id="key" type="password" size="16" autocomplete="off"></label>
  <button id="saveKey">保存</button>
  <span id="conn" class="status muted">未接続</span>
  <span id="error"></span>
</header>

<main>
  <section class="wide">
    <div id="mode" style="margin-bottom:8px"></div>
    <div id="diagramFilter" class="row"></div>
    <div id="diagram" style="position:relative; touch-action:none"></div>
    <div id="diagramTip" class="muted" style="min-height:1.5em"></div>
  </section>
  <section class="wide">
    <h2>出発順序・単線区間の走行順</h2>
    <div id="orders"></div>
  </section>
  <section class="wide">
    <div id="queue"></div>
  </section>
  <section class="wide">
    <h2>列車別設定</h2>
    <div id="trains"></div>
  </section>
  <section class="wide">
    <h2>手動進路構成</h2>
    <iframe id="circuitMap" src="tid.html?names=1&embed=1" title="軌道回路名つきの配線" style="width:100%; height:320px; border:1px solid var(--line); border-radius:6px; margin-bottom:8px; background:#fff"></iframe>
    <div id="manual"></div>
  </section>
  <section class="wide">
    <div id="continues"></div>
  </section>
  <section>
    <h2>駅の扱い</h2>
    <div id="stationModes"></div>
  </section>
  <section>
    <h2>自動退避設定</h2>
    <div id="passing"></div>
  </section>
  <section class="wide">
    <h2>作動中の特発</h2>
    <div id="incidents"></div>
  </section>
</main>

<script src="diapanel.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let key = "";
  try { key = localStorage.getItem("gokkoDiaKey") || ""; } catch (e) {}
  $("key").value = key;

  // 中身が変わったときだけ描き直す（毎秒作り直すと、押している途中のボタンが消えて押し損ねるため）
  function setHtml(el, html) {
    if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html; }
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function api(method, path, body) {
    const res = await fetch("/api/dia" + path, {
      method,
      headers: { "X-Dia-Key": key, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
      cache: "no-store"
    });
    let json = null;
    try { json = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((json && (json.message || json.detail)) || ("HTTP " + res.status));
    return json;
  }

  async function act(method, path, body) {
    try { await api(method, path, body); $("error").textContent = ""; await refresh(); }
    catch (e) { $("error").textContent = e.message; }
  }


  // ---- ダイヤグラム・順序・進路を取る順番・列車別設定・継続乗務申請・駅の扱い・自動退避設定（diapanel.js の共通部品。管理画面と同じ） ----
  const diagramView = GokkoDia.diagramView({ box: $("diagram"), tip: $("diagramTip"), filter: $("diagramFilter"), act });
  const orders = GokkoDia.orderEditor({ el: $("orders"), act });
  const trainSettings = GokkoDia.trainEditor({ el: $("trains"), act });
  const queue = GokkoDia.queuePanel({ el: $("queue"), api, help: false });
  const continues = GokkoDia.continuePanel({ el: $("continues"), act, help: false });
  const mode = GokkoDia.modePanel({ el: $("mode"), act, help: false });
  const stationModes = GokkoDia.stationModePanel({ el: $("stationModes"), act });
  const passing = GokkoDia.passingPanel({ el: $("passing"), act });
  // 手動進路構成: 不用意に取り消さないよう、取消のたびに「通告は完了したか？」を確かめる（開通は確かめない）
  const manual = GokkoDia.manualRoutePanel({ el: $("manual"), api, after: () => refresh(), confirm: true });
  function renderDiagram(d) {
    orders.update(d); diagramView.update(d); queue.update(d); continues.update(d); mode.update(d); stationModes.update(d); passing.update(d);
  }

  // 作動中の特発（解除だけ）
  function renderIncidents(list) {
    const html = list.length === 0 ? `<div class="muted">作動中の特発はありません</div>`
      : `<table>${list.map((i) => `<tr><td><b>${GokkoDia.esc(i.crossing)}</b></td><td class="muted">${GokkoDia.esc(i.reason)}</td>
          <td class="muted">${GokkoDia.esc(i.source)}・${GokkoDia.hhmm(Date.parse(i.started), true)}${i.releaseInSeconds == null ? "" : `・あと${i.releaseInSeconds}秒で自動復帰`}</td>
          <td><button data-release="${GokkoDia.esc(i.crossing)}">解除</button></td></tr>`).join("")}</table>`;
    if ($("incidents").dataset.key === html) return;
    $("incidents").dataset.key = html;
    $("incidents").innerHTML = html;
  }
  $("incidents").addEventListener("click", async (ev) => {
    const b = ev.target.closest("button[data-release]");
    if (!b || !confirm(`${b.dataset.release} の特発を解除しますか？`)) return;
    await act("POST", "/release", { crossing: b.dataset.release });
  });

  async function refresh() {
    if (!key) { $("conn").textContent = "合言葉を入力してください"; $("conn").className = "status muted"; return; }
    try {
      renderDiagram(await api("GET", "/diagram"));
      const trains = (await api("GET", "/trains")).trains;
      trainSettings.update(trains);
      manual.update(trains);
      renderIncidents((await api("GET", "/incidents")).incidents);
      $("conn").textContent = "接続中"; $("conn").className = "status ok";
      $("error").textContent = "";
    } catch (e) {
      $("conn").textContent = "接続できません"; $("conn").className = "status ng";
      $("error").textContent = e.message;
    }
  }

  $("saveKey").onclick = () => {
    key = $("key").value;
    try { localStorage.setItem("gokkoDiaKey", key); } catch (e) {}
    refresh();
  };
  $("key").addEventListener("keydown", (ev) => { if (ev.key === "Enter") $("saveKey").click(); });

  // 軌道回路名つきの配線（埋め込み）: 図の高さに合わせる
  window.addEventListener("message", (ev) => {
    if (ev.origin === location.origin && ev.data && ev.data.gokkoTidHeight) $("circuitMap").style.height = ev.data.gokkoTidHeight + "px";
  });

  refresh();
  setInterval(refresh, 1000);
})();
</script>
</body>
</html>
